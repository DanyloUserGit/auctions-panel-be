version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - rabbitmq
    # Додаємо це, щоб файл був фізично доступний Prisma всередині контейнера
    volumes:
      - ./apps/auctions-panel-be/.env:/app/.env
    env_file:
      - ./apps/auctions-panel-be/.env
    # Видаліть або закоментуйте явне призначення DATABASE_URL, 
    # якщо хочете, щоб вона бралася ТІЛЬКИ з env_file
    # environment:
    #   - DATABASE_URL=${DATABASE_URL} 
    ports:
      - "8000:8000"
    restart: always

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - rabbitmq
    env_file:
      - ./apps/auctions-panel-be/.env
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
