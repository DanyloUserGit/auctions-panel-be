version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auctions_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - rabbitmq
    volumes:
      - ./apps/auctions-panel-be/.env:/app/.env
    env_file:
      - ./apps/auctions-panel-be/.env
    ports:
      - "8000:8000"
    restart: always

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - rabbitmq
    restart: always
    shm_size: '2gb'
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - NODE_ENV=development
      - DISPLAY=:99
      - WEBRTC_ANNOUNCED_IP=127.0.0.1
    ports:
      - "10000-10050:10000-10050/udp"
volumes:
  postgres_data:
