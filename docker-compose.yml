version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: auctions_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  mysql-client:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_TABLE_EXTOURCARS1_PASS}
      MYSQL_DATABASE: table_extourcars1
    ports:
      - "3307:3306"
    volumes:
      - client_mysql_data:/var/lib/mysql
      - ./table_extourcars1.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  mysql-caddylc2:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_CADDYLC2_CADDYCOMBCA_PASS}
      MYSQL_DATABASE: caddylc2_caddycombca
    ports:
      - "3308:3306" 
    volumes:
      - caddylc2_mysql_data:/var/lib/mysql
      - ./caddylc2_caddycombca.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - rabbitmq
      - mysql-client
      - mysql-caddylc2
    volumes:
      - ./apps/auctions-panel-be/.env:/app/.env
    env_file:
      - ./apps/auctions-panel-be/.env
    ports:
      - "8000:8000"
      - "5555:5555"
    restart: always

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    depends_on:
      - rabbitmq
    restart: always
    shm_size: '3gb' # 3gb max on prod!
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - NODE_ENV=development
      - WEBRTC_ANNOUNCED_IP=127.0.0.1
    ports:
      - "10000-10050:10000-10050/udp"
volumes:
  postgres_data:
  client_mysql_data:
  caddylc2_mysql_data:
