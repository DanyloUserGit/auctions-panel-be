name: Auto Deploy auctions-panel-be

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /var/www/auctions/auctions-panel-be

            git pull origin main

            export HUSKY=0
            npm ci --omit=dev

            npx prisma migrate deploy
            npx prisma generate

            npm run build

            pm2 reload auctions-panel-be || pm2 start dist/src/main.js --name auctions-panel-be

            pm2 save
