version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  browser-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - .:/app
      - /app/node_modules 
    # ОНОВЛЕНИЙ РЯДОК: Спершу ставимо всі пакети (включаючи dev), а потім запускаємо
    command: sh -c "npm install && npm run start:dev browser-worker"
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - NODE_ENV=development
      - DISPLAY=:99
    env_file:
      - .env
    depends_on:
      - rabbitmq
    shm_size: '2gb'